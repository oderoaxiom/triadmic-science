    <main class="container">
        <section class="card">
            <h1>Feedback & Peer Review</h1>
            <div class="sub-title">Submit Critique, Inquiries, or Peer Review Notes on Triadmics Papers</div>

            <form action="https://formspree.io/f/odero.triad@gmail.com" method="POST">
                <div class="form-group">
                    <label for="name">Your Name / Academic Institution</label>
                    <input type="text" id="name" name="name" placeholder="Dr. Jane Doe / Independent Researcher" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="jane.doe@university.edu" required>
                </div>

                <div class="form-group">
                    <label for="topic">Research Area / Paper Title</label>
                    <input type="text" id="topic" name="topic" placeholder="e.g., Odero Axiom / ERT Cosmology / Captured Inflation">
                </div>

                <div class="form-group">
                    <label for="message">Comments & Technical Critique</label>
                    <textarea id="message" name="message" rows="6" placeholder="Provide detailed technical feedback or scientific inquiries..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Review</button>
            </form>
        </section>
    </main>
